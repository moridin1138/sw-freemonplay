[package]
name = "freemonplay-client"
description = "Shows a freemonplay virtual display full screen and sends input back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fmp-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
mdns-sd.workspace = true
quinn.workspace = true
rand.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"

# Each OS decodes with its own H.264 decoder (see src/decode). Linux keeps bundled
# OpenH264 as a last resort for systems without GStreamer's H.264 plugins.
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
openh264.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
objc2-metal = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
