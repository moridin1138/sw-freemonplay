[package]
name = "freemonplay-host"
description = "Creates virtual displays and streams them to freemonplay clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fmp-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
mdns-sd.workspace = true
openh264.workspace = true
quinn.workspace = true
rand.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry", "NSObject"] }
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
