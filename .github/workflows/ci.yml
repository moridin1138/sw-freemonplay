# Tests and builds every platform on each push and pull request. release.yml reuses it to
# produce the downloads for a tagged release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (menu bar app + client, universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build the menu bar app
        run: ./build/macos/bundle.sh --universal
      - name: Build the client app
        run: ./build/macos/bundle.sh --client --universal
      - name: Package
        run: |
          ./build/macos/make-dmg.sh target/freemonplay.app dist/freemonplay-macos.dmg
          ./build/macos/make-dmg.sh "target/freemonplay Screen.app" dist/freemonplay-screen-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p freemonplay-client -p freemonplay-host
      - name: Display driver
        # The Virtual Display Driver (MIT licensed, signed by the SignPath Foundation) that
        # the host installer bundles. Pinned by version and checksum.
        shell: pwsh
        run: |
          $base = "https://github.com/VirtualDrivers/Virtual-Display-Driver"
          Invoke-WebRequest "$base/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip" -OutFile vdd.zip
          $hash = (Get-FileHash vdd.zip -Algorithm SHA256).Hash
          if ($hash -ne "E24210692B442B39AF763536330CE78B423F19342B7A7792C26DE3944E418B3A") { throw "unexpected driver download ($hash)" }
          Expand-Archive vdd.zip -DestinationPath vdd
          Invoke-WebRequest "https://raw.githubusercontent.com/VirtualDrivers/Virtual-Display-Driver/25.7.23/LICENSE" -OutFile vdd/VirtualDisplayDriver/LICENSE.txt
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, client | Out-Null
          Copy-Item target/release/freemonplay-client.exe, LICENSE, README.md client/
          Compress-Archive -Path client/* -DestinationPath dist/freemonplay-screen-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" build\windows\freemonplay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" build\windows\freemonplay-host.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (client)
    # Oldest supported Ubuntu, so the binary runs on 22.04+, Debian 12+ and similar.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer development files
        # The runner image's libunwind-14-dev conflicts with the libunwind-dev that
        # libgstreamer1.0-dev needs, so remove it first.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p freemonplay-client
      - name: Package
        run: |
          mkdir -p dist freemonplay-screen
          cp target/release/freemonplay-client LICENSE README.md build/linux/freemonplay-screen.desktop freemonplay-screen/
          cp build/macos/icon/icon-1024.png freemonplay-screen/freemonplay.png
          tar -czf dist/freemonplay-screen-linux-x86_64.tar.gz freemonplay-screen
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
