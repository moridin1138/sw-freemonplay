# Tests and builds every platform on each push and pull request. release.yml reuses it to
# produce the downloads for a tagged release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_KEY_P8_BASE64:
        required: false
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (menu bar app + client, universal)
    runs-on: macos-15
    env:
      # Releases are signed with a Developer ID and notarized once the Apple secrets exist
      # (see SIGNING.md); other builds are ad-hoc signed.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Import the Developer ID certificate
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo -n "$P12" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain"
          echo -n "$ASC_KEY" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build the menu bar app
        env:
          FMP_SIGN_IDENTITY: ${{ env.SIGN == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: ./build/macos/bundle.sh --universal
      - name: Build the client app
        env:
          FMP_SIGN_IDENTITY: ${{ env.SIGN == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: ./build/macos/bundle.sh --client --universal
      - name: Package
        env:
          FMP_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ "$SIGN" = true ]; then
            ./build/macos/notarize.sh "target/Freemonplay Host.app" dist/freemonplay-host-macos.dmg
            ./build/macos/notarize.sh "target/Freemonplay Screen.app" dist/freemonplay-screen-macos.dmg
          else
            ./build/macos/make-dmg.sh "target/Freemonplay Host.app" dist/freemonplay-host-macos.dmg
            ./build/macos/make-dmg.sh "target/Freemonplay Screen.app" dist/freemonplay-screen-macos.dmg
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-2022
    env:
      # Releases are signed through the SignPath Foundation once the project is set up
      # there (see SIGNING.md); each signing request waits for a person to approve it.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p freemonplay-screen -p freemonplay-host
      - name: Upload the programs for signing
        if: env.SIGN == 'true'
        id: unsigned-exes
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exes
          path: |
            target/release/freemonplay-host.exe
            target/release/freemonplay-screen.exe
      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sw-freemonplay
          signing-policy-slug: release-signing
          artifact-configuration-slug: exes
          github-artifact-id: ${{ steps.unsigned-exes.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed-exes
      - name: Use the signed programs
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-exes/*.exe target/release/ -Force
      - name: Display driver
        # The Virtual Display Driver (MIT licensed, signed by the SignPath Foundation) that
        # the host installer bundles. Pinned by version and checksum.
        shell: pwsh
        run: |
          $base = "https://github.com/VirtualDrivers/Virtual-Display-Driver"
          Invoke-WebRequest "$base/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip" -OutFile vdd.zip
          $hash = (Get-FileHash vdd.zip -Algorithm SHA256).Hash
          if ($hash -ne "E24210692B442B39AF763536330CE78B423F19342B7A7792C26DE3944E418B3A") { throw "unexpected driver download ($hash)" }
          Expand-Archive vdd.zip -DestinationPath vdd
          Invoke-WebRequest "https://raw.githubusercontent.com/VirtualDrivers/Virtual-Display-Driver/25.7.23/LICENSE" -OutFile vdd/VirtualDisplayDriver/LICENSE.txt
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, client | Out-Null
          Copy-Item target/release/freemonplay-screen.exe, LICENSE, README.md client/
          Compress-Archive -Path client/* -DestinationPath dist/freemonplay-screen-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" build\windows\freemonplay-screen.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" build\windows\freemonplay-host.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the installers for signing
        if: env.SIGN == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: dist/*-setup.exe
      - name: Sign the installers
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sw-freemonplay
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed-installers
      - name: Use the signed installers
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-installers/*.exe dist/ -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (client)
    # Oldest supported Ubuntu, so the binary runs on 22.04+, Debian 12+ and similar.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer development files
        # The runner image's libunwind-14-dev conflicts with the libunwind-dev that
        # libgstreamer1.0-dev needs, so remove it first.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p freemonplay-screen
      - name: Package
        run: |
          mkdir -p dist freemonplay-screen
          cp target/release/freemonplay-screen LICENSE README.md build/linux/freemonplay-screen.desktop freemonplay-screen/
          cp build/macos/icon/icon-1024.png freemonplay-screen/freemonplay.png
          tar -czf dist/freemonplay-screen-linux-x86_64.tar.gz freemonplay-screen
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
