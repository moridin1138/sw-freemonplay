# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) builds every
# platform and publishes a GitHub Release with the downloads attached.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Mac (the computer that wants more screens):** download `freemonplay-macos.zip`, unzip, move freemonplay to Applications. The first time, right-click it and choose Open (it isn't notarized by Apple).

          **Screens:** download the client for each device: macOS, Windows or Linux. On Windows, SmartScreen may warn because the program isn't signed; choose More info, then Run anyway. Linux needs GStreamer's plugins: `sudo apt install gstreamer1.0-plugins-bad gstreamer1.0-libav` (plus `intel-media-va-driver` for Intel GPU decoding).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "freemonplay $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
