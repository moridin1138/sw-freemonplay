# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) builds every
# platform and publishes a GitHub Release with the downloads attached.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Mac (the computer that wants more screens):** open `freemonplay-macos.dmg` and drag freemonplay to Applications. The first time, right-click it and choose Open (it isn't notarized by Apple yet).

          **Screens:** on each device that should become a screen (or take the Mac's keyboard and mouse):
          - **Windows:** run `freemonplay-screen-windows-x64-setup.exe` (no administrator rights needed; a newer one updates in place). SmartScreen may warn because it isn't signed; choose More info, then Run anyway. `freemonplay-screen-windows-x64.zip` is the same program without an installer.
          - **Mac:** open `freemonplay-screen-macos.dmg`, drag freemonplay Screen to Applications, and right-click > Open the first time.
          - **Linux:** unpack `freemonplay-screen-linux-x86_64.tar.gz` and run `freemonplay-client` (the `.desktop` file adds it to the app menu). It needs GStreamer's plugins: `sudo apt install gstreamer1.0-plugins-bad gstreamer1.0-libav` (plus `intel-media-va-driver` for Intel GPU decoding).
          EOF
          # This version's section of CHANGELOG.md (from "## [x.y.z]" to the next "## [").
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          if [ -s changes.md ]; then
            { echo; echo "## What's new"; cat changes.md; } >> notes.md
          else
            echo "::warning::CHANGELOG.md has no section for $version"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "freemonplay $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
