# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) builds every
# platform and publishes a GitHub Release with the downloads attached.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    # Signing credentials (see SIGNING.md); builds stay unsigned while they're missing.
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          - **Mac:** open `freemonplay-macos.dmg`, drag Freemonplay to Applications, then choose Host or Screen.
          - **Windows:** run `freemonplay-windows-x64-setup.exe`, open Freemonplay, then choose Host or Screen. The host setup guide can install the display driver and firewall rule when needed.
          - **Linux:** unpack `freemonplay-screen-linux-x86_64.tar.gz` and run `freemonplay-screen`. The included desktop entry adds it to the app menu. Install GStreamer's plugins: `sudo apt install gstreamer1.0-plugins-bad gstreamer1.0-libav` (plus `intel-media-va-driver` for Intel GPU decoding).

          The downloads aren't signed with a paid certificate, so macOS and Windows warn the first time: [what to expect and how to open them](https://github.com/moridin1138/sw-freemonplay#security-warnings-when-installing).
          EOF
          # This version's section of CHANGELOG.md (from "## [x.y.z]" to the next "## [").
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          if [ -s changes.md ]; then
            { echo; echo "## What's new"; cat changes.md; } >> notes.md
          else
            echo "::warning::CHANGELOG.md has no section for $version"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Freemonplay $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
