[workspace]
resolver = "2"
members = ["crates/proto", "crates/host", "crates/client"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/moridin1138/sw-freemonplay"

[workspace.dependencies]
rust-i18n = "4"
sys-locale = "0.3"
fmp-proto = { path = "crates/proto" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
mdns-sd = "0.21"
openh264 = "0.9"
postcard = { version = "1.1", features = ["use-std"] }
quinn = "0.11"
rand = "0.9"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

# openh264 is painfully slow unoptimised; keep it fast even in debug builds.
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
